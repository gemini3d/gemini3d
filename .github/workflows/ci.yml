name: ci

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1

on:
  push:
    paths-ignore:
      - "cmake/intel.cmake"
      - "cmake/cray.cmake"
      - ".github/workflows/ci_windows.yml"
      - ".github/workflows/ci_macos.yml"
      - ".github/workflows/oneapi-linux.yml"
      - "docs/**"
      - "scripts/**"
      - "**.md"

  workflow_dispatch:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  gcc:
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        gcc: [11, 12, 13, 14]

    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
      FC: gfortran-${{ matrix.gcc }}

    runs-on: ${{ matrix.os }}

    steps:
    - &checkout
      uses: actions/checkout@v7

    - name: Install GCC if needed (Linux)
      shell: bash
      if: ${{ runner.os == 'Linux' && matrix.gcc < 12 }}
      run: sudo apt install -y --no-install-recommends gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} gfortran-${{ matrix.gcc }}

    - &pkg
      uses: ./.github/actions/composite-pkg

    - &linux-build
      uses: ./.github/actions/composite-unix

  hwm-msis:
    timeout-minutes: 15
    strategy:
      matrix:
        model: [msis2]

    runs-on: ubuntu-latest

    steps:
    - *checkout

    - *pkg

    - name: workflow ${{ matrix.model }}
      run: cmake --workflow ${{ matrix.model }}


  cmake-oldest:
    timeout-minutes: 15

    runs-on: ubuntu-latest

    strategy:
      matrix:
        cmake_version: ["3.26.6"]

    steps:

    - *checkout

    - *pkg

    - name: Install CMake ${{ matrix.cmake_version }}
      timeout-minutes: 10
      uses: ./.github/actions/composite-cmake

    - run: $CMAKE --workflow --preset gmake
